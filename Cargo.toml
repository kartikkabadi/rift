[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/ffi"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.0.12"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
filetime = "0.2"
libc = "0.2"
rand = "0.9"
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.8"
ulid = "1.2"
walkdir = "2.5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
] }
