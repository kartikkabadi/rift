name: CI

on:
  push:
    branches:
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace --locked

  opencode-plugin-test:
    name: OpenCode plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/opencode
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

  linux-filesystem-test:
    name: Linux filesystem tests (${{ matrix.filesystem }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - filesystem: btrfs
            packages: btrfs-progs
            required_env: RIFT_REQUIRE_BTRFS_TESTS
          - filesystem: xfs-reflink
            packages: xfsprogs
            required_env: RIFT_REQUIRE_REFLINK_TESTS
          - filesystem: zfs
            packages: zfsutils-linux
            required_env: RIFT_REQUIRE_REFLINK_TESTS
          - filesystem: xfs-no-reflink
            packages: xfsprogs
            required_env: RIFT_REQUIRE_UNSUPPORTED_LINUX_TESTS
          - filesystem: ext4
            packages: e2fsprogs
            required_env: RIFT_REQUIRE_UNSUPPORTED_LINUX_TESTS
          - filesystem: tmpfs
            packages: ""
            required_env: RIFT_REQUIRE_UNSUPPORTED_LINUX_TESTS
          - filesystem: f2fs
            packages: f2fs-tools
            required_env: RIFT_REQUIRE_UNSUPPORTED_LINUX_TESTS
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install filesystem tools
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.packages }}

      - name: Prepare filesystem and run tests
        run: |
          bash scripts/ci/linux-fs.sh "${{ matrix.filesystem }}" -- \
            env ${{ matrix.required_env }}=1 cargo test --package rift --package rift-cli --locked

  apfs-test:
    name: APFS integration tests
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests on APFS
        env:
          RIFT_REQUIRE_APFS_TESTS: "1"
        run: cargo test --package rift --locked

  windows-test:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace --locked

  linux-arm-test:
    name: Linux arm64 tests
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace --locked

  musl-test:
    name: Alpine/musl smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and smoke test in Alpine
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src rust:alpine \
            sh -c 'set -e
            apk add --no-cache musl-dev pkgconf
            cargo build --package rift-cli --release --locked --target x86_64-unknown-linux-musl
            binary="./target/x86_64-unknown-linux-musl/release/rift"
            "$binary" doctor /src
            mkdir /tmp/ws
            "$binary" init /tmp/ws --here
            "$binary" create /tmp/ws --name child
            "$binary" list /tmp/ws'

  cow-image-test:
    name: Copy-on-write image end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes btrfs-progs

      - name: Build rift
        run: cargo build --package rift-cli --locked

      - name: Exercise init --cow-image
        run: bash scripts/ci/linux-cow-image.sh "${{ github.workspace }}/target/debug/rift"

  npm-e2e:
    name: npm package end-to-end (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Build native artifacts
        run: cargo build --package rift-cli --package rift-ffi --release --locked

      - name: Populate prebuild
        run: node scripts/prepare-npm-prebuild.mjs "npm/rift-snapshot/prebuilds/linux-x64" "target/release/rift" "target/release/librift_ffi.so"

      - name: Pack and install
        run: |
          mkdir -p dist e2e
          (cd npm/rift-snapshot && npm pack --pack-destination ../../dist)
          cd e2e
          npm init -y >/dev/null
          npm install ../dist/rift-snapshot-*.tgz

      - name: Exercise CLI and Node API
        working-directory: e2e
        run: |
          mkdir workspace
          npx rift init workspace --here
          npx rift create workspace --name child
          npx rift doctor workspace
          node --input-type=module -e "
            const rift = await import('rift-snapshot')
            const fs = await import('node:fs')
            const path = await import('node:path')
            const dir = fs.mkdtempSync(path.join(process.cwd(), 'api-'))
            const source = path.join(dir, 'src')
            fs.mkdirSync(source)
            fs.writeFileSync(path.join(source, 'file.txt'), 'api content')
            rift.init({ at: source })
            const child = rift.create({ from: source, name: 'kid' })
            if (fs.readFileSync(path.join(child, 'file.txt'), 'utf8') !== 'api content')
              throw new Error('copy diverged')
            const probe = rift.doctor({ of: source })
            if (!probe.backend) throw new Error('doctor returned no backend')
            console.log('api e2e ok:', probe.backend)
          "
